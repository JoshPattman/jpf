name: Go CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23.1"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          awk -F: '
          NR==1 { next }
          {
            n = split($1, f, "/")
            pkg = f[1]
            for (i = 2; i < n; i++) pkg = pkg "/" f[i]
            split($2, rest, " ")
            stmts = rest[2]; count = rest[3]
            total[pkg] += stmts
            if (count + 0 > 0) covered[pkg] += stmts
          }
          END {
            for (p in total) printf "%-45s %6.1f%%\n", p, 100 * covered[p] / total[p]
          }
          ' coverage.out | sort
          go tool cover -func=coverage.out | tail -1