name: Go Integration Tests

on:
  push:
    branches: ["main"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23.1"

      - name: Run integration tests
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: go test --tags integration -v -coverprofile=integration.out -coverpkg=./... ./integration/

      - name: Run unit tests for coverage
        run: go test -coverprofile=unit.out ./...

      - name: Overall coverage
        run: |
          head -n1 unit.out > merged.out
          tail -n +2 unit.out >> merged.out
          tail -n +2 integration.out >> merged.out
          go tool cover -func=merged.out | tail -1